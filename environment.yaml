name: AsyDiff
channels:
  - defaults
dependencies:
  - python=3.8.20
  # Lightning 1.6.5 has legacy metadata rejected by pip >= 24.1.
  - pip=24.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.4.1+cu121
      - torchvision==0.19.1+cu121
      - xformers==0.0.28.post1
      - -r requirements.txt
      - -e .
